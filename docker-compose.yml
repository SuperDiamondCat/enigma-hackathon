services:
  enigma:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enigma
    restart: unless-stopped
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.enigma.rule=Host(`enigma.urfubest.ru`)"
      - "traefik.http.routers.enigma.entryPoints=https"
      - "traefik.http.routers.enigma.tls=true"
      - "traefik.http.routers.enigma.tls.certresolver=letsEncrypt"
      - "traefik.http.routers.enigma.tls.options=default"
      - "traefik.http.routers.enigma.service=enigma"
      - "traefik.http.services.enigma.loadbalancer.server.port=81"

networks:
  traefik:
    external: true
